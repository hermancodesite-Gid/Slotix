<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Slotix Test Build</title>
<script src="telegram.org"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #07090d;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  color: white;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* ФИКСИРОВАННЫЙ HEADER */
.header {
  width: 100%;
  height: 64px;
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,.05);
  background: #0d1117;
}

.profile {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #1d2733;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.user-data {
  display: flex;
  flex-direction: column;
}

.username {
  font-size: 13px;
  font-weight: 700;
}

.balance {
  font-size: 12px;
  color: #00ff88;
  font-weight: bold;
}

.cashier-btn {
  border: none;
  background: linear-gradient(135deg, #00ff88, #00ccff);
  color: black;
  padding: 8px 14px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
}

/* НАВИГАЦИЯ (ТАБЫ) */
.tabs {
  width: 100%;
  height: 48px;
  display: flex;
  background: #11161d;
  border-bottom: 1px solid rgba(255,255,255,.05);
}

.tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: #aaa;
  font-weight: 600;
  cursor: pointer;
}

.tab.active {
  color: white;
  border-bottom: 3px solid #00ff88;
}

/* КОНТЕНТНАЯ ЧАСТЬ */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.game-section {
  display: none;
  width: 100%;
}

.game-section.active {
  display: block;
}

.game-card {
  width: 100%;
  background: #121821;
  border-radius: 16px;
  padding: 20px;
  border: 1px solid rgba(255,255,255,.04);
  box-shadow: 0 4px 20px rgba(0,0,0,.4);
}

/* ИГРА CRASH */
.crash-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 0;
}

.multiplier {
  font-size: 52px;
  font-weight: 900;
  color: #00ff88;
  margin-bottom: 5px;
}

.status {
  font-size: 13px;
  color: #888;
  margin-bottom: 25px;
}

/* ИГРА СЛОТЫ */
.slots-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 15px 0;
}

.reels {
  display: flex;
  gap: 12px;
  margin-bottom: 25px;
}

.reel {
  width: 70px;
  height: 70px;
  background: #0d1117;
  border: 2px solid #1d2733;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}

/* ПАНЕЛЬ УПРАВЛЕНИЯ КНОПКАМИ */
.controls {
  width: 100%;
  display: flex;
  gap: 10px;
}

.bet-input {
  flex: 1;
  height: 46px;
  background: #0d1117;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  color: white;
  padding: 0 12px;
  font-size: 15px;
  outline: none;
}

.action-btn {
  height: 46px;
  padding: 0 18px;
  border: none;
  border-radius: 12px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  color: black;
  background: #00ff88;
}

.cashout-btn {
  background: #00ccff;
}

/* АДМИН ПАНЕЛЬ */
.admin-panel {
  background: #121821;
  border-radius: 16px;
  padding: 16px;
}

.admin-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
}

.metric-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 15px;
}

.metric {
  background: #0d1117;
  padding: 12px;
  border-radius: 12px;
  font-size: 12px;
  color: #888;
}

.metric-value {
  font-size: 18px;
  font-weight: 800;
  color: white;
  margin-top: 4px;
}

.slider-wrap {
  background: #0d1117;
  padding: 12px;
  border-radius: 12px;
  font-size: 13px;
}

.slider {
  width: 100%;
  margin-top: 8px;
}
</style>
</head>
<body>

<div id="app">
  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <div class="header">
    <div class="profile">
      <div class="avatar">
        <img id="avatar" src="placehold.co" alt="avatar">
      </div>
      <div class="user-data">
        <div class="username" id="username">@test_user</div>
        <div class="balance" id="balance">1000.00 CR</div>
      </div>
    </div>
    <button class="cashier-btn">Cashier</button>
  </div>

  <!-- ВЫБОР ИГРЫ -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('crash')">Crash</div>
    <div class="tab" onclick="switchTab('slots')">Slots</div>
    <div class="tab" onclick="switchTab('admin')">Admin</div>
  </div>

  <!-- ОСНОВНАЯ ЗОНА -->
  <div class="main">
    
    <!-- ЭКРАН КРАШ ИГРЫ -->
    <div id="section-crash" class="game-section active">
      <div class="game-card">
        <div class="crash-container">
          <div class="multiplier" id="multiplier">1.00x</div>
          <div class="status" id="status">Waiting for server...</div>
          <div class="controls">
            <input class="bet-input" id="betInput" type="number" value="10" />
            <button class="action-btn" id="startBtn">START</button>
            <button class="action-btn cashier-btn" id="cashoutBtn" style="background:#00ccff;">CASH</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ЭКРАН СЛОТОВ -->
    <div id="section-slots" class="game-section">
      <div class="game-card">
        <div class="slots-container">
          <div class="reels">
            <div class="reel" id="r1">🍒</div>
            <div class="reel" id="r2">🍒</div>
            <div class="reel" id="r3">🍒</div>
          </div>
          <div class="controls">
            <input class="bet-input" id="slotBetInput" type="number" value="10" />
            <button class="action-btn" id="spinBtn">SPIN</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ЭКРАН АДМИНКИ -->
    <div id="section-admin" class="game-section">
      <div class="admin-panel">
        <div class="admin-title">Admin Dashboard</div>
        <div class="metric-grid">
          <div class="metric">Traffic <div class="metric-value" id="traffic">1</div></div>
          <div class="metric">Profit <div class="metric-value" id="profit">0.00 CR</div></div>
        </div>
        <div class="slider-wrap">
          RTP (Шанс отдачи): <span id="rtpValue">95%</span>
          <input type="range" min="0" max="100" value="95" class="slider" id="rtpSlider" />
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// Настройка Telegram WebApp SDK
const tg = window.Telegram.WebApp;
tg.expand();
const user = tg.initDataUnsafe.user || { id: 1, username: "test_user" };
document.getElementById("username").innerText = "@" + user.username;
if(user.photo_url) document.getElementById("avatar").src = user.photo_url;

let balance = 1000;
function updateBalanceUI(val) {
  balance = val;
  document.getElementById("balance").innerText = val.toFixed(2) + " CR";
}

// ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК (РАБОТАЕТ НА КЛИКАХ МГНОВЕННО)
function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
  
  event.currentTarget.classList.add('active');
  document.getElementById('section-' + tabName).classList.add('active');
}

// ПОДКЛЮЧЕНИЕ К СЕРВЕРУ ЧЕРЕЗ ЧИСТЫЕ СТАНДАРТНЫЕ ВЕБ-СОКЕТЫ
// Замени IP на IPv4 своего ноута, когда будешь тестировать с телефона!
const ws = new WebSocket("ws://localhost:3000"); 

ws.onopen = () => {
  // Отправляем авторизацию сразу при подключении
  ws.send(JSON.stringify({ type: 'auth', userId: user.id, username: user.username }));
};

ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);
  
  if (msg.type === 'auth_success') {
    updateBalanceUI(msg.user.balance);
    document.getElementById("rtpValue").innerText = msg.rtp + "%";
    document.getElementById("rtpSlider").value = msg.rtp;
  }
  if (msg.type === 'balance_update') {
    updateBalanceUI(msg.balance);
  }
  if (msg.type === 'crash_waiting') {
    document.getElementById('status').innerText = "Ожидание ставок...";
    document.getElementById('multiplier').style.color = "#00ff88";
  }
  if (msg.type === 'multiplier_update') {
    document.getElementById('multiplier').innerText = msg.multiplier.toFixed(2) + "x";
    document.getElementById('status').innerText = "Летим!";
  }
  if (msg.type === 'crash_crashed') {
    document.getElementById('status').innerText = "КРАШ!";
    document.getElementById('multiplier').style.color = "#ff3b30";
    document.getElementById('multiplier').innerText = msg.finalMultiplier.toFixed(2) + "x";
  }
  if (msg.type === 'slot_result') {
    document.getElementById('r1').innerText = msg.combination[0];
    document.getElementById('r2').innerText = msg.combination[1];
    document.getElementById('r3').innerText = msg.combination[2];
    alert("Выпало: " + msg.combination.join(" | ") + "\nВыигрыш: " + msg.win + " CR");
  }
  if (msg.type === 'admin_update_metrics') {
    document.getElementById('traffic').innerText = msg.traffic;
    document.getElementById('profit').innerText = msg.profit.toFixed(2) + " CR";
  }
  if (msg.type === 'error') {
    alert(msg.message);
  }
};

// ОБРАБОТЧИКИ КНОПОК ДЛЯ ИГРЫ
document.getElementById('startBtn').addEventListener('click', () => {
  const amt = parseFloat(document.getElementById('betInput').value);
  ws.send(JSON.stringify({ type: 'place_bet', amount: amt }));
});

document.getElementById('cashoutBtn').addEventListener('click', () => {
  ws.send(JSON.stringify({ type: 'cashout' }));
});

document.getElementById('spinBtn').addEventListener('click', () => {
  const amt = parseFloat(document.getElementById('slotBetInput').value);
  ws.send(JSON.stringify({ type: 'spin_slots', amount: amt }));
});

document.getElementById('rtpSlider').addEventListener('input', (e) => {
  const val = e.target.value;
  document.getElementById("rtpValue").innerText = val + "%";
  ws.send(JSON.stringify({ type: 'admin_change_rtp', rtp: val }));
});
</script>
</body>
</html>
